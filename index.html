<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ousado comes home</title>

  <!-- MapLibre (the map) and Turf (geographic calculations) -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.2.0/turf.min.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 70px; width: 100%; }
    #controls { position: absolute; bottom: 0; height: 70px; width: 100%; padding: 10px 20px; box-sizing: border-box; }
    #slider { width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="controls">
    <div id="label">Drag the slider to follow Ousado over time</div>
    <input id="slider" type="range" min="0" max="1" value="0">
  </div>

  <script src="main.js"></script>
</body>
</html>
